name: UI supply chain

on:
  pull_request:
    paths:
      - "ui/**"
  push:
    branches: [main]
    paths:
      - "ui/**"

permissions:
  contents: read

jobs:
  ui-audit:
    name: npm ci, audit, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Audit (moderate+)
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build static assets
        run: npm run build

      - name: Verify committed ui/dist matches the build
        # The Go binary embeds ui/dist, so a stale dist ships stale UI code.
        # Rebuild with `cd ui && npm ci && npm run build` and commit ui/dist.
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::ui/dist is out of date with ui/src. Run 'cd ui && npm ci && npm run build' and commit ui/dist."
            git status --short -- dist
            exit 1
          fi

      - name: Verify Go embed compiles
        working-directory: ${{ github.workspace }}
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/sqlforge ./cmd/sqlforge

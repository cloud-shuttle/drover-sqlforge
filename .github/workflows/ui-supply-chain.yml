name: UI supply chain

on:
  pull_request:
    paths:
      - "ui/**"
  push:
    branches: [main]
    paths:
      - "ui/**"

permissions:
  contents: read

jobs:
  ui-audit:
    name: npm ci, lint, audit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      # Production dependencies are what the embedded UI ships. The lint and
      # Vite toolchain currently depend on picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf)
      # and no patched release exists, so a full audit cannot go green.
      - name: Audit production dependencies (moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build static assets
        run: npm run build

      - name: Check committed ui/dist matches build
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- ui/dist

      - name: Verify Go embed compiles
        working-directory: ${{ github.workspace }}
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/sqlforge ./cmd/sqlforge
